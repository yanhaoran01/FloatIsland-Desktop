name: 问题反馈
description: 报告可复现的程序问题
body:
  - type: input
    id: version
    attributes:
      label: 应用版本与发布格式
      placeholder: 1.3.3，安装版或便携版
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本与显示设置
      placeholder: Windows 11，缩放 125%，单屏
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从打开程序开始，说明在哪一步出现问题。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 错误信息或补充说明
      description: 日志请仅保留相关片段，移除密钥、Cookie、账号信息和私人文件内容。
