[package]
name = "fusion-host"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0"
[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8"
tracing = "0.1"
echoisland-adapters = { path = "../../../vendor/EchoIsland/crates/adapters" }
echoisland-core = { path = "../../../vendor/EchoIsland/crates/core" }
echoisland-runtime = { path = "../../../vendor/EchoIsland/crates/runtime" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }


libc = "0.2"

[[bin]]
name = "fusion-host"
path = "src/main.rs"

[[bin]]
name = "fusion-hook"
path = "src/hook.rs"
